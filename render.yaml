# Render.com Infrastructure-as-Code Blueprint
# Complete Free-Tier Deployment for RouteFill AI Platform

databases:
  - name: routefill-db
    databaseName: routefill_db
    user: routefill_user
    plan: free
    region: oregon

services:
  # 1. Python ML Microservice (Scikit-Learn / FastAPI)
  - type: web
    name: routefill-ml-service
    runtime: python
    rootDir: ml-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python train_initial_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"

  # 2. Node.js Express Backend API
  - type: web
    name: routefill-backend
    runtime: node
    rootDir: routefill-backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: routefill-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_SYNC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ML_SERVICE_URL
        fromService:
          name: routefill-ml-service
          type: web
          property: host
      - key: CORS_ORIGIN
        value: "*"

  # 3. Web Canvas UI Frontend (Static Site)
  - type: web
    name: routefill-canvas
    runtime: static
    rootDir: routefill-canvas
    buildCommand: npm install && npm run build
    staticPublishPath: .output/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: routefill-backend
          type: web
          property: host
