<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rf-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rf-emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="rf-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="rf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="64" height="64" rx="16" fill="url(#rf-grad-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Orbiting Route Rings -->
  <circle cx="32" cy="32" r="22" stroke="#06b6d4" stroke-opacity="0.18" stroke-dasharray="3 3" fill="none" />

  <!-- Connected Route Loop (Connecting Origin -> Terminus -> Return Load) -->
  <path d="M19 38 C15 28, 24 18, 34 18 C45 18, 48 26, 47 32 C46 39, 36 44, 27 44 C20 44, 16 39, 19 34" 
        stroke="url(#rf-emerald-cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#rf-glow)" />

  <!-- Arrow vector for Forward Flow -->
  <path d="M44 26 L49 32 L42 34" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center AI Node -->
  <rect x="25" y="27" width="14" height="10" rx="3" fill="#0b1329" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="32" cy="32" r="2" fill="#10b981" filter="url(#rf-glow)" />

  <!-- High-tech Waypoint Sparks -->
  <circle cx="47" cy="18" r="2.5" fill="#38bdf8" filter="url(#rf-glow)" />
  <circle cx="17" cy="43" r="2" fill="#34d399" filter="url(#rf-glow)" />
</svg>
