services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: routefill_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routefill_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_prod_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routefill_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: routefill_ml_service
    restart: unless-stopped
    environment:
      PORT: 8000
      CORS_ORIGIN: "http://localhost:5000,http://backend:5000,http://localhost:3000,http://canvas:3000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Node.js Backend API
  backend:
    build:
      context: ./routefill-backend
      dockerfile: Dockerfile
    container_name: routefill_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: routefill_db
      DB_USER: postgres
      DB_PASSWORD: postgres_secure_prod_password
      DB_SSL: "false"
      DB_SYNC: "true"
      JWT_SECRET: "routefill_super_secure_jwt_random_token_production_key_32_chars_long"
      JWT_EXPIRES_IN: "7d"
      ML_SERVICE_URL: "http://ml-service:8000"
      CORS_ORIGIN: "http://localhost:3000,http://canvas:3000,http://localhost:5173"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', (res) => { if (res.statusCode !== 200) process.exit(1); })\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Web Canvas UI Frontend
  canvas:
    build:
      context: ./routefill-canvas
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000/api"
    container_name: routefill_canvas
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
